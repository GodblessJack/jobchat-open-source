name: Bug report
description: Report a reproducible problem in JobChat
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include credentials, private user data, or production database content. Security vulnerabilities should be reported privately using SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
      placeholder: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js, npm, PostgreSQL, browser, and deployment mode.
      placeholder: Ubuntu 24.04, Node 22, npm 10, PostgreSQL 16, Chrome...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste sanitized logs only. Remove tokens, cookies, API keys, personal data, and absolute private paths.
      render: text
